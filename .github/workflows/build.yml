name: Build and Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  # 加入下面这一行，GitHub 网页上就会出现 "Run workflow" 按钮
  workflow_dispatch:
    inputs:
      release_tag:
        description: '如果手动运行并希望发布Release，请输入版本号 (如 v1.0.0)，留空则只编译不发布'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      # 情况 1：如果是通过 Push Tag 触发的自动发布
      - name: Upload to GitHub Release (Auto Tag Push)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: build/libs/*.jar
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 情况 2：如果是通过网页手动点击触发，并且填了版本号，则发布 Release
      - name: Upload to GitHub Release (Manual Trigger)
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != ''
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          files: build/libs/*.jar
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 情况 3：作为编译产物供下载 (仅对非Tag触发的情况生效，比如PR或手动纯编译)
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: Mod-Jars
          path: build/libs/*.jar
          retention-days: 7
