name: Build and Release

# 触发条件：
# 1. 推送到 main/master 分支或提交 PR 时：只构建，不发布
# 2. 推送以 v 开头的 tag（如 v1.0.0）时：构建并发布 Release
on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]

# 必须赋予 contents: write 权限，否则无法创建 Release
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      # 下面的步骤只有在推送 tag 时才会执行
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          # 上传 build/libs 目录下的所有 jar 文件
          # 如果你只想上传特定文件，可以改成例如 build/libs/your-mod-1.0.0.jar
          files: build/libs/*.jar
          # 自动生成 Release Notes（根据 commit 记录）
          generate_release_notes: true
          # 如果是测试版可以设为 true
          prerelease: false
          # 设为 true 则是草稿状态，需要手动发布
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
